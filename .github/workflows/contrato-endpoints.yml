name: Contrato de endpoints (reutilizable)

# Workflow reutilizable: cada backend lo invoca con
#   uses: gutierrezcarlos510/core-springboot-template/.github/workflows/contrato-endpoints.yml@v1
#   with:
#     service: RESTOBAR
# Requiere que el backend tenga scripts/export-endpoints.mjs, scripts/openapi-coverage.mjs
# y OpenApiExportTest ya instalados (ver templates/ de este repo). Falla si:
# 1. docs/endpoints/*.json no refleja los controllers actuales.
# 2. docs/openapi/*.json no refleja los controllers y DTOs (no requiere base de datos).

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: "17"
    secrets:
      maven-packages-token:
        required: false

jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar contrato de endpoints al día
        run: node scripts/export-endpoints.mjs --service ${{ inputs.service }} --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Verificar OpenAPI al día
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.maven-packages-token }}
        run: mvn -B -q test -Dtest=OpenApiExportTest -Dopenapi.check=true -Dsurefire.failIfNoSpecifiedTests=false

      - name: Cobertura de documentación
        run: node scripts/openapi-coverage.mjs --service ${{ inputs.service }}
