name: Esquema de base de datos (reutilizable)

# Workflow reutilizable: cada backend lo invoca con
#   uses: gutierrezcarlos510/infosystem-dev-tools/.github/workflows/esquema-bd.yml@v1
#   with:
#     service: RESTOBAR
# Requiere scripts/export-db-schema.mjs instalado (ver templates/ de este repo).
# Aplica las migraciones Flyway del backend desde cero contra un Postgres efímero
# del job y falla si una migración está rota o si docs/database/ quedó desactualizado.
#
# Estándar de la plantilla: el script Node (export-db-schema.mjs), NO un test Java —
# no depende de arrancar el contexto Spring y corre igual en cualquier backend, tenga
# o no JdbcTemplate/JPA. (restobar-backend-2026 todavía usa un test Java propio,
# DbSchemaExportTest; migrarlo a este script es un pendiente, ver su docs/PENDIENTES.md.)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      postgres-version:
        required: false
        type: string
        default: '16'

jobs:
  esquema:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Migraciones aplican desde cero y docs/database al día
        run: node scripts/export-db-schema.mjs --service ${{ inputs.service }} --check
